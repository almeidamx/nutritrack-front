<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="920" height="520" fill="#f6f7f9"/>
  <text x="460" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">NutriTrack — Arquitetura em cadeia</text>
  <text x="460" y="60" text-anchor="middle" font-size="13" fill="#6b7280">O front nunca fala com a Open Food Facts diretamente</text>

  <!-- Usuario -->
  <g>
    <circle cx="70" cy="250" r="26" fill="#16a34a"/>
    <text x="70" y="256" text-anchor="middle" font-size="22" fill="#fff">&#128100;</text>
    <text x="70" y="300" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Usuário</text>
  </g>

  <!-- Front container -->
  <g>
    <rect x="150" y="170" width="220" height="160" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="260" y="160" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">CONTAINER DOCKER</text>
    <text x="260" y="200" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">Front (React + Vite)</text>
    <text x="260" y="224" text-anchor="middle" font-size="12" fill="#6b7280">Componente principal</text>
    <rect x="176" y="242" width="168" height="66" rx="10" fill="#dcfce7"/>
    <text x="260" y="266" text-anchor="middle" font-size="13" font-weight="600" fill="#15803d">nginx</text>
    <text x="260" y="286" text-anchor="middle" font-size="11" fill="#166534">serve o estático +</text>
    <text x="260" y="300" text-anchor="middle" font-size="11" fill="#166534">proxy /api → API</text>
  </g>

  <!-- API container -->
  <g>
    <rect x="440" y="150" width="230" height="230" rx="14" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <text x="555" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">CONTAINER DOCKER</text>
    <text x="555" y="180" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">API (Flask)</text>
    <text x="555" y="200" text-anchor="middle" font-size="12" fill="#6b7280">2ª componente · REST + Swagger</text>
    <rect x="464" y="216" width="182" height="52" rx="10" fill="#eff6ff"/>
    <text x="555" y="238" text-anchor="middle" font-size="12" font-weight="600" fill="#1d4ed8">Normalização + cache</text>
    <text x="555" y="255" text-anchor="middle" font-size="11" fill="#1e40af">nome PT, kcal, arredondamento</text>
    <!-- SQLite -->
    <path d="M478 300 a40 8 0 0 0 80 0 v-24 a40 8 0 0 0 -80 0 z" fill="#e0e7ff" stroke="#6366f1"/>
    <ellipse cx="518" cy="276" rx="40" ry="8" fill="#c7d2fe" stroke="#6366f1"/>
    <text x="518" y="296" text-anchor="middle" font-size="11" font-weight="600" fill="#3730a3">SQLite</text>
    <text x="518" y="340" text-anchor="middle" font-size="10" fill="#6b7280">Entries · Products (cache) · Goal</text>
    <rect x="586" y="284" width="64" height="44" rx="8" fill="#fef9c3" stroke="#eab308"/>
    <text x="618" y="303" text-anchor="middle" font-size="10" font-weight="600" fill="#854d0e">CRUD</text>
    <text x="618" y="318" text-anchor="middle" font-size="9" fill="#854d0e">/entries</text>
  </g>

  <!-- OFF external -->
  <g>
    <rect x="730" y="150" width="160" height="230" rx="14" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
    <text x="810" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">Open Food</text>
    <text x="810" y="200" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">Facts</text>
    <text x="810" y="220" text-anchor="middle" font-size="11" fill="#92400e">serviço externo</text>
    <rect x="748" y="236" width="124" height="54" rx="8" fill="#ffffff" stroke="#fbbf24"/>
    <text x="810" y="256" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">/api/v2/product</text>
    <text x="810" y="272" text-anchor="middle" font-size="9" fill="#92400e">detalhe por barcode</text>
    <rect x="748" y="300" width="124" height="54" rx="8" fill="#ffffff" stroke="#fbbf24"/>
    <text x="810" y="320" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">Search-a-licious</text>
    <text x="810" y="336" text-anchor="middle" font-size="9" fill="#92400e">busca por texto</text>
  </g>

  <!-- Arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <line x1="98" y1="250" x2="146" y2="250" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="374" y1="250" x2="436" y2="250" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="405" y="240" text-anchor="middle" font-size="11" font-weight="600" fill="#374151">HTTP</text>
  <text x="405" y="268" text-anchor="middle" font-size="10" fill="#6b7280">GET/POST/PUT/DELETE</text>

  <line x1="674" y1="250" x2="726" y2="250" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="700" y="240" text-anchor="middle" font-size="10" fill="#6b7280">GET</text>

  <!-- Legend / methods -->
  <text x="460" y="430" text-anchor="middle" font-size="12" font-weight="600" fill="#374151">Momentos das chamadas (front → API)</text>
  <text x="460" y="452" text-anchor="middle" font-size="11" fill="#6b7280">Buscar produto = GET /products/search · Adicionar registro = POST /entries</text>
  <text x="460" y="470" text-anchor="middle" font-size="11" fill="#6b7280">Editar quantidade/meta = PUT /entries/&#123;id&#125; e PUT /goal · Remover = DELETE /entries/&#123;id&#125;</text>
  <text x="460" y="488" text-anchor="middle" font-size="11" fill="#6b7280">Dashboard = GET /summary · Lista paginada = GET /entries</text>
</svg>
