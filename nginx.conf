# Config do nginx que serve o front estatico e faz proxy de /api para a API.
# Assim o front chama sempre o caminho relativo /api (mesma origem) e nao
# precisa saber a URL da API em build time.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Encaminha as chamadas de API para o container da API Flask.
    location /api/ {
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA: qualquer rota desconhecida cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
